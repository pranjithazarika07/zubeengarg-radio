<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zubeen Garg Radio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;

  background:
    linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.82)),
    url("zubeen.jpg") center center/cover fixed no-repeat;
}

.radio{
  min-height:100vh;
  padding:55px 18px 40px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logo{
  font-size:42px;
  margin-bottom:8px;
  text-shadow:0 3px 15px #000;
}

.subtitle{
  font-size:16px;
  letter-spacing:3px;
  opacity:.8;
  margin-bottom:28px;
}

.live{
  display:inline-block;
  padding:12px 24px;
  border-radius:30px;
  background:rgba(180,0,0,.85);
  font-size:19px;
  font-weight:bold;
  margin-bottom:25px;
  box-shadow:0 5px 25px rgba(255,0,0,.3);
}

.card{
  width:100%;
  max-width:720px;
  padding:22px;
  border-radius:25px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}

.now{
  font-size:22px;
  margin-bottom:18px;
  font-weight:bold;
}

.player{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:18px;
  background:#111;
}

.player iframe{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  border:0;
}

.footer{
  margin-top:25px;
  font-size:13px;
  opacity:.65;
}
</style>
</head>

<body>

<div class="radio">

  <div class="logo">🎵 Zubeen Garg Radio</div>

  <div class="subtitle">ASSAMESE MUSIC • 24/7 RADIO</div>

  <div class="live">🔴 LIVE RADIO</div>

  <div class="card">

    <div class="now">🎧 Now Playing</div>

    <div class="player">
      <iframe
        src="https://www.youtube.com/embed/videoseries?list=PLfGOIvl9F0pw&autoplay=1&loop=1"
        title="Zubeen Garg Radio"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

  </div>

  <div class="footer">
    © Zubeen Garg Radio
  </div>

</div>

</body>
</html>
